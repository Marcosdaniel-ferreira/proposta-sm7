<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SM7 — Proposta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
<link rel="icon" type="image/png" href="./imagens/favicon-2.jpg">
</head>
<body class="travado">

  <!-- HUD DE INTRODUÇÃO ESTILO JARVIS -->
  <div id="hud-intro">
    
    <!-- Botão de Início -->
    <button id="btn-acao">[ TOQUE NA TELA PARA DECODIFICAR ]</button>

    <!-- Conteúdo holográfico exibido pós-toque -->
    <div id="hud-conteudo">
      
      <!-- Moldura com os 4 cantos em "L" -->
      <div class="hud-foto-wrapper">
        <span class="hud-corner tl"></span>
        <span class="hud-corner tr"></span>
        <span class="hud-corner bl"></span>
        <span class="hud-corner br"></span>

        <div class="hud-foto-container">
          <img src="imagens/teste.png" alt="Alvo" class="hud-foto" id="hud-foto" onerror="this.style.opacity='0'" />
          <div class="hud-scanner"></div>
        </div>
      </div>

      <div class="hud-alvo-tag">// DIRECIONADO: Pepper Potts</div>
      <div id="texto-maquina"></div>
      
      <!-- Esta dica só aparece quando o texto finalizar -->
      <div class="hud-dica-avancar" id="dica-avancar">[ TOQUE NOVAMENTE PARA ACESSAR A PROPOSTA ]</div>
    </div>

    <audio id="audio-voz" src="audio/papper.mp3" preload="auto"></audio>
  </div>

  <!-- AVISO MOBILE -->
  <div class="aviso-mobile">
    Para melhorar sua experiência ao ler o documento, deite o celular.
  </div>

  <!-- SLIDES ORIGINAIS -->
  <section class="slides">
    <div class="slide"><img src="imagens/01.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/02.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/03.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/04.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/05.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/06.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/07.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/08.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/09.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/10.jpg" alt="" /></div>
    <div class="slide"><img src="imagens/11.jpg" alt="" /></div>
  </section>

  <!-- FOOTER ORIGINAL -->
  <footer>
    <img class="footer-logo" src="imagens/logo.png" alt="SM7" />
    <div class="footer-divider"></div>
    <span class="footer-name">Marcos Ferreira</span>
    <span class="footer-role">Diretor de Arte</span>

    <div class="footer-links">
      <a href="https://www.instagram.com/dsgnstudiom7/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
        Instagram
      </a>
      <div class="footer-sep"></div>
      <a href="https://wa.me/message/2C4G2O66U5YCJ1" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        WhatsApp
      </a>
    </div>
    <span class="footer-copy">© SM7 Studio — Todos os direitos reservados</span>
  </footer>

  <!-- LIGHTBOX CONTAINER -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-fechar" id="lightbox-fechar">&times;</div>
    <img src="" alt="" id="lightbox-img" />
  </div>

 <script src="script.js"></script>

</body>
